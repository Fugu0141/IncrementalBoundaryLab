name: build-mozc-bridge

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/mozc-responsibility-ime-v0.6
    paths:
      - "mozc_overlay/**"
      - "tools/setup_mozc_bridge.ps1"
      - "tools/apply_mozc_tip_responsibility_patch.ps1"
      - ".github/workflows/mozc-bridge.yml"

jobs:
  windows-mozc-bridge:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bazelisk
        shell: powershell
        run: choco install bazelisk -y

      - name: Clone pinned Mozc
        shell: powershell
        run: |
          git clone https://github.com/google/mozc.git .external\mozc
          cd .external\mozc
          git checkout 921b8cc99904c8d31b771e395513da0a5d55182a

      - name: Fetch Mozc build dependencies
        shell: powershell
        working-directory: .external/mozc/src
        run: python build_tools/update_deps.py

      - name: Install BoundaryLab Mozc overlays
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force .external\mozc\src\boundary_bridge | Out-Null
          New-Item -ItemType Directory -Force .external\mozc\src\responsibility | Out-Null
          Copy-Item mozc_overlay\boundary_bridge\* .external\mozc\src\boundary_bridge\ -Force
          Copy-Item mozc_overlay\responsibility\* .external\mozc\src\responsibility\ -Force

      - name: Test native responsibility decoder
        shell: powershell
        working-directory: .external/mozc/src
        run: |
          bazelisk test --config release_build --test_output=errors //responsibility:responsibility_decoder_test
          bazelisk test --config release_build --test_output=errors //responsibility:responsibility_output_test
          bazelisk test --config release_build --test_output=errors //responsibility:responsibility_runtime_test

      - name: Build native Mozc oracle and bridge
        shell: powershell
        working-directory: .external/mozc/src
        run: |
          bazelisk build --config release_build //responsibility:mozc_japanese_oracle
          bazelisk build --config release_build //boundary_bridge:boundary_mozc_bridge

      - name: Apply Responsibility state to Mozc TSF
        shell: powershell
        run: .\tools\apply_mozc_tip_responsibility_patch.ps1 -MozcDir ".external\mozc"

      - name: Build patched Mozc TSF
        shell: powershell
        working-directory: .external/mozc/src
        run: bazelisk build --config release_build //win32/tip:mozc_tip64

      - name: Collect native artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts\mozc | Out-Null
          Copy-Item .external\mozc\src\bazel-bin\boundary_bridge\boundary_mozc_bridge.exe artifacts\mozc\boundary_mozc_bridge.exe

          $Tip = Get-ChildItem .external\mozc\src\bazel-bin -Recurse -Filter mozc_tip64.dll |
            Select-Object -First 1
          if (-not $Tip) {
            throw "mozc_tip64.dll was not found after a successful TSF build."
          }
          Copy-Item $Tip.FullName artifacts\mozc\mozc_tip64.dll

          Copy-Item .external\mozc\LICENSE artifacts\mozc\MOZC_LICENSE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: boundary-mozc-native
          path: artifacts/mozc
