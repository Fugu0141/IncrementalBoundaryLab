name: build

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build core
        run: dotnet build src/BoundaryLab.Core/BoundaryLab.Core.csproj -c Release
      - name: Run RCR focused regression tests
        run: dotnet run --project tests/BoundaryLab.Core.SelfTests/BoundaryLab.Core.SelfTests.csproj -c Release

  lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run Evidence Lattice tests
        run: dotnet run --project tests/BoundaryLab.Core.LatticeTests/BoundaryLab.Core.LatticeTests.csproj -c Release

  mozc-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run Mozc Responsibility contract tests
        run: dotnet run --project tests/BoundaryLab.Core.MozcTests/BoundaryLab.Core.MozcTests.csproj -c Release


  stream-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run Stream Hybrid v1 regression and work tests
        run: dotnet run --project tests/BoundaryLab.Core.StreamTests/BoundaryLab.Core.StreamTests.csproj -c Release

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run large-scale RCR stress/property tests
        run: dotnet run --project tests/BoundaryLab.Core.StressTests/BoundaryLab.Core.StressTests.csproj -c Release

  winforms:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build WinForms prototype
        run: dotnet build src/BoundaryLab.WinForms/BoundaryLab.WinForms.csproj -c Release

  research-evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline research metric self-tests
        run: python3 -m unittest discover -s research -p "test_*.py"
